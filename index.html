<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Balances et équations - activité interactive</title>
  <style>
    :root{
      --bg:#f6f7fb; --card:#ffffff; --ink:#2f3542; --muted:#6b7280;
      --green:#2f9e57; --red:#d9534f; --blue:#3b82f6; --pink:#ec8fa3;
      --shadow: 0 18px 50px rgba(31,41,55,.16); --radius:24px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;background:linear-gradient(135deg,#f7fbff,#fff8f3);color:var(--ink);min-height:100vh;}
    .app{max-width:1180px;margin:0 auto;padding:18px 18px 28px;}
    header{display:flex;align-items:center;gap:16px;justify-content:space-between;margin-bottom:14px;}
    .title{display:flex;align-items:center;gap:12px;font-weight:800;font-size:clamp(18px,2.5vw,28px)}
    .logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#c7e9ff,#ffd5db);display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.08);font-size:24px}
    .progressWrap{flex:1;max-width:380px;min-width:160px;}
    .progressText{font-size:13px;color:var(--muted);text-align:right;margin-bottom:4px;font-weight:650}
    .progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden;}
    .progress > div{height:100%;width:0%;background:linear-gradient(90deg,#7dd3fc,#86efac);transition:width .35s ease;border-radius:999px;}
    .slide{min-height:690px;background:rgba(255,255,255,.74);backdrop-filter: blur(6px);border:1px solid rgba(255,255,255,.75);border-radius:32px;box-shadow:var(--shadow);padding:28px;position:relative;overflow:hidden;}
    .slide:before{content:"";position:absolute;inset:auto -100px -160px auto;width:360px;height:360px;border-radius:50%;background:rgba(125,211,252,.18);z-index:0}.slide>*{position:relative;z-index:1}
    .screenBadge{position:absolute;right:26px;top:20px;border:2px solid #d1d5db;background:white;border-radius:999px;width:46px;height:46px;display:grid;place-items:center;font-weight:800;color:#6b7280;}
    .layout{display:grid;grid-template-columns:minmax(420px,1.05fr) minmax(360px,.95fr);gap:28px;align-items:center;min-height:590px;}
    @media (max-width:900px){.layout{grid-template-columns:1fr;}.slide{min-height:auto;padding:18px}.balanceCard{min-height:380px}.screenBadge{right:16px;top:14px;width:38px;height:38px}}
    .balanceCard{background:#fff;border:1px solid #e5e7eb;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.07);padding:18px;min-height:500px;display:grid;place-items:center;}
    .balanceCard svg{width:100%;max-width:560px;height:auto;display:block;}
    .balanceCard.shake{animation:shake .32s linear}.balanceCard.successPulse{animation:successPulse .9s ease}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
    @keyframes successPulse{0%{box-shadow:0 0 0 rgba(47,158,87,0)}45%{box-shadow:0 0 0 8px rgba(47,158,87,.15)}100%{box-shadow:0 10px 30px rgba(0,0,0,.07)}}
    .panel{background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:26px;box-shadow:0 10px 30px rgba(0,0,0,.06);}
    h1,h2{margin:.1em 0 .6em} h1{font-size:clamp(28px,4.5vw,52px);line-height:.98} h2{font-size:clamp(22px,3vw,34px)}
    p{font-size:18px;line-height:1.55;margin:.4em 0}.small{font-size:14px;color:var(--muted)}
    .instructionList{display:grid;gap:12px;margin-top:16px}.instructionList div{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:18px;background:#f8fafc;border:1px solid #e5e7eb}.instructionList strong{color:#111827}
    .formula{font-size:28px;font-family:Georgia, 'Times New Roman', serif;text-align:center;padding:18px;border-radius:16px;background:#f8fafc;border:1px solid #e5e7eb;margin:14px 0 8px;}
    .inputRow{display:flex;gap:12px;align-items:center;margin:18px 0}.inputRow label{font-size:26px;font-family:Georgia,serif;white-space:nowrap}.answerInput{font-size:24px;line-height:1;border:2px solid #d1d5db;border-radius:16px;padding:16px 18px;width:100%;outline:none;transition:border-color .2s, box-shadow .2s}.answerInput:focus{border-color:#60a5fa;box-shadow:0 0 0 4px rgba(96,165,250,.14)}.answerInput.ok{border-color:var(--green);background:#f0fff4}.answerInput.ko{border-color:var(--red);background:#fff5f5}.reasonBox{margin-top:12px}.reasonLabel{display:block;font-size:15px;font-weight:800;color:#374151;margin-bottom:8px}.reasonTextarea{width:100%;min-height:120px;resize:vertical;border:2px solid #d1d5db;border-radius:16px;padding:14px 16px;font:16px/1.45 Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;outline:none;background:#fff;transition:border-color .2s, box-shadow .2s}.reasonTextarea:focus{border-color:#60a5fa;box-shadow:0 0 0 4px rgba(96,165,250,.14)}.traceNote{font-size:13px;color:#64748b;margin-top:7px}.exportBtn{font-size:13px;padding:10px 12px;border-radius:12px;white-space:nowrap}.reasonBadge{display:inline-flex;align-items:center;gap:6px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:999px;padding:6px 10px;font-size:13px;color:#475569;font-weight:750}
    button{font:inherit;font-weight:750;border:0;border-radius:16px;padding:14px 18px;cursor:pointer;transition:transform .15s ease,opacity .2s ease,box-shadow .2s ease}button:hover{transform:translateY(-1px)}button:active{transform:translateY(1px)}.primary{background:#3b82f6;color:#fff;box-shadow:0 9px 22px rgba(59,130,246,.25)}.secondary{background:#f3f4f6;color:#374151;border:1px solid #e5e7eb}.success{background:#2f9e57;color:#fff}.danger{background:#ef4444;color:#fff}.ghost{background:transparent;color:#4b5563;border:1px dashed #d1d5db}.btnRow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:18px}.nav button{min-width:120px}.feedback{margin-top:14px;padding:14px 16px;border-radius:16px;font-weight:750;display:none}.feedback.show{display:block}.feedback.ok{background:#ecfdf3;color:#166534;border:1px solid #bbf7d0}.feedback.ko{background:#fff1f2;color:#991b1b;border:1px solid #fecdd3}.feedback.info{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
    .options{display:grid;gap:12px;margin-top:16px}.option{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid #e5e7eb;border-radius:16px;padding:14px 16px;text-align:left;font-size:22px;font-family:Georgia,serif;color:#111827}.option .radio{width:22px;height:22px;border:2px solid #cbd5e1;border-radius:50%;display:inline-block;flex:none;background:white}.option.correct{border-color:#22c55e;background:#f0fff4}.option.correct .radio{background:#22c55e;box-shadow:inset 0 0 0 5px white}.option.wrong{border-color:#ef4444;background:#fff1f2}.option.wrong .radio{background:#ef4444;box-shadow:inset 0 0 0 5px white}
    .buildGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.dropSide{min-height:145px;border:2px dashed #cbd5e1;border-radius:18px;padding:12px;background:#f8fafc}.dropSide h3{margin:0 0 10px;font-size:16px;color:#4b5563}.tokens{display:flex;gap:8px;flex-wrap:wrap;min-height:50px}.palette{display:flex;gap:10px;flex-wrap:wrap;padding:12px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:18px;margin:12px 0}.token{display:inline-flex;align-items:center;justify-content:center;min-width:48px;height:48px;border-radius:12px;border:2px solid #94a3b8;background:white;font-weight:800;font-size:19px;user-select:none}.token.var{background:#fee2e2;border-color:#f87171}.token.num{background:#dbeafe;border-color:#60a5fa}.token.big{background:#dcfce7;border-color:#4ade80}.sideAdd{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.sideAdd button{font-size:13px;padding:9px;border-radius:12px}.chipLabel{font-size:14px;font-weight:800;color:#64748b;width:100%;margin-top:6px}.correction{margin-top:12px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:18px;padding:14px;display:none}.correction.show{display:block}.kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#f1f5f9;border:1px solid #cbd5e1;border-radius:6px;padding:2px 6px}
    .introGrid{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:center}.miniBalances{display:grid;gap:16px}.mini{background:white;border:1px solid #e5e7eb;border-radius:20px;padding:12px;box-shadow:0 8px 22px rgba(0,0,0,.05)}
    @media(max-width:900px){.introGrid{grid-template-columns:1fr}.panel{padding:18px}.buildGrid{grid-template-columns:1fr}.screenBadge{position:static;margin-left:auto;margin-bottom:10px}.slide{overflow:visible}.formula{font-size:24px}.answerInput{font-size:21px}}
    .footerNote{font-size:13px;color:#64748b;text-align:center;margin-top:14px}.locked{opacity:.45;pointer-events:none}.hidden{display:none!important}
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="title"><div class="logo">⚖️</div><span>Balances et équations</span></div>
      <div class="progressWrap"><div class="progressText" id="progressText">Écran 1 / 27</div><div class="progress"><div id="progressBar"></div></div></div>
      <button class="secondary exportBtn" onclick="exportTrace()">Télécharger mes réponses</button>
    </header>
    <section class="slide" id="slide"></section>
    <div class="footerNote">Activité interactive autonome : validation des réponses, feedback immédiat, animation de la balance et saisie du raisonnement.</div>
  </main>
<script>
const slides = [
  {type:'intro', num:1},
  {type:'input', num:2, variable:'x', answer:5, tilt:7, left:[{label:'x',shape:'circle',color:'white'}], right:[{label:'5',shape:'rect',color:'#c9b6f2'}], tip:'Un seul poids inconnu doit avoir la même masse que 5.'},
  {type:'input', num:3, variable:'y', answer:8, tilt:7, left:[{label:'y',shape:'circle',color:'white'}], right:[{label:'4',shape:'rect',color:'#ffd1d1'},{label:'4',shape:'rect',color:'#ffd1d1'}], tip:'À droite, il y a deux masses de 4.'},
  {type:'input', num:4, variable:'a', answer:4, tilt:7, left:[{label:'a',shape:'circle',color:'white'},{label:'3',shape:'rect',color:'#bfdbfe'}], right:[{label:'7',shape:'rect',color:'#fed7aa'}], tip:'Cherche la valeur qui complète 3 pour obtenir 7.'},
  {type:'mcq', num:5, left:[{label:'a',shape:'circle',color:'white'},{label:'3',shape:'rect',color:'#bfdbfe'}], right:[{label:'7',shape:'rect',color:'#fed7aa'}], options:['3a = 7','a + 3 = 7','a / 3 = 7','a - 3 = 7'], correct:1},
  {type:'input', num:6, variable:'w', answer:4, tilt:7, left:[{label:'w',shape:'circle',color:'white'},{label:'6',shape:'rect',color:'#bbf7d0'}], right:[{label:'5',shape:'rect',color:'#bfdbfe'},{label:'5',shape:'rect',color:'#bfdbfe'}], tip:'À droite, 5 + 5 = 10.'},
  {type:'mcq', num:7, left:[{label:'w',shape:'circle',color:'white'},{label:'6',shape:'rect',color:'#bbf7d0'}], right:[{label:'5',shape:'rect',color:'#bfdbfe'},{label:'5',shape:'rect',color:'#bfdbfe'}], options:['6w = 10','w / 6 = 10','w + 6 = 10','w - 6 = 10'], correct:2},
  {type:'build', num:8, equation:'x + 3 = 10', targetLeft:['x','3'], targetRight:['10'], palette:['x','3','10'], hint:'Place x et 3 du même côté, puis 10 de l’autre côté.'},
  {type:'input', num:9, variable:'x', answer:8, tilt:7, left:[{label:'x',shape:'rect',color:'#fecaca'},{label:'x',shape:'rect',color:'#fecaca'}], right:[{label:'16',shape:'rectTall',color:'#bdbdbd'}], tip:'Deux fois la même valeur donnent 16.'},
  {type:'mcq', num:10, left:[{label:'x',shape:'rect',color:'#fecaca'},{label:'x',shape:'rect',color:'#fecaca'}], right:[{label:'16',shape:'rectTall',color:'#bdbdbd'}], options:['2x = 16','x + 2 = 16','x - 2 = 16','x / 2 = 16'], correct:0},
  {type:'input', num:11, variable:'h', answer:3, tilt:-7, left:[{label:'h',shape:'pentagon',color:'#fed7aa'},{label:'h',shape:'pentagon',color:'#fed7aa'}], right:[{label:'6',shape:'rect',color:'#bbf7d0'}], tip:'Deux masses identiques donnent 6.'},
  {type:'mcq', num:12, left:[{label:'h',shape:'pentagon',color:'#fed7aa'},{label:'h',shape:'pentagon',color:'#fed7aa'}], right:[{label:'6',shape:'rect',color:'#bbf7d0'}], options:['h / 2 = 6','h + 2 = 6','2h = 6','h - 2 = 6'], correct:2},
  {type:'input', num:13, variable:'p', answer:9, tilt:-7, left:[{label:'18',shape:'rectTall',color:'#bbf7d0'}], right:[{label:'p',shape:'pentagon',color:'#ddd6fe'},{label:'p',shape:'pentagon',color:'#ddd6fe'}], tip:'18 est partagé en deux masses identiques.'},
  {type:'mcq', num:14, left:[{label:'18',shape:'rectTall',color:'#bbf7d0'}], right:[{label:'p',shape:'pentagon',color:'#ddd6fe'},{label:'p',shape:'pentagon',color:'#ddd6fe'}], options:['18 = 2p','18 = p - 2','18 = p + 2','18 = p / 2'], correct:0},
  {type:'build', num:15, equation:'2k = 14', targetLeft:['k','k'], targetRight:['14'], palette:['k','14'], hint:'2k signifie deux masses k.'},
  {type:'input', num:16, variable:'z', answer:4, tilt:-7, left:[{label:'z',shape:'rect',color:'#fecaca'},{label:'z',shape:'rect',color:'#fecaca'},{label:'z',shape:'rect',color:'#fecaca'}], right:[{label:'12',shape:'triangle',color:'#bbf7d0'}], tip:'Trois masses identiques donnent 12.'},
  {type:'mcq', num:17, left:[{label:'z',shape:'rect',color:'#fecaca'},{label:'z',shape:'rect',color:'#fecaca'},{label:'z',shape:'rect',color:'#fecaca'}], right:[{label:'12',shape:'triangle',color:'#bbf7d0'}], options:['z / 3 = 12','z + 3 = 12','z - 3 = 12','3z = 12'], correct:3},
  {type:'input', num:18, variable:'c', answer:7, tilt:7, left:[{label:'28',shape:'rectTall',color:'#bfdbfe'}], right:[{label:'c',shape:'triangle',color:'#ddd6fe'},{label:'c',shape:'triangle',color:'#ddd6fe'},{label:'c',shape:'triangle',color:'#ddd6fe'},{label:'c',shape:'triangle',color:'#ddd6fe'}], tip:'28 est réparti en quatre masses identiques.'},
  {type:'mcq', num:19, left:[{label:'28',shape:'rectTall',color:'#bfdbfe'}], right:[{label:'c',shape:'triangle',color:'#ddd6fe'},{label:'c',shape:'triangle',color:'#ddd6fe'},{label:'c',shape:'triangle',color:'#ddd6fe'},{label:'c',shape:'triangle',color:'#ddd6fe'}], options:['28 = 4 - c','28 = c + 4','28 = 4c','28 = c / 4'], correct:2},
  {type:'build', num:20, equation:'18 = 3x', targetLeft:['18'], targetRight:['x','x','x'], palette:['18','x'], hint:'3x signifie trois masses x.'},
  {type:'input', num:21, variable:'r', answer:5, tilt:-7, left:[{label:'r',shape:'rect',color:'#fecaca'},{label:'r',shape:'rect',color:'#fecaca'},{label:'4',shape:'triangle',color:'#bfdbfe'}], right:[{label:'14',shape:'rectTall',color:'#bbf7d0'}], tip:'Deux r et 4 donnent 14.'},
  {type:'mcq', num:22, left:[{label:'r',shape:'rect',color:'#fecaca'},{label:'r',shape:'rect',color:'#fecaca'},{label:'4',shape:'triangle',color:'#bfdbfe'}], right:[{label:'14',shape:'rectTall',color:'#bbf7d0'}], options:['2r + 4 = 14','2r - 4 = 14','2 + r + 4 = 14','2r + 4'], correct:0},
  {type:'input', num:23, variable:'z', answer:9, tilt:7, left:[{label:'21',shape:'circle',color:'white'}], right:[{label:'z',shape:'triangle',color:'#fed7aa'},{label:'z',shape:'triangle',color:'#fed7aa'},{label:'3',shape:'rect',color:'#bfdbfe'}], tip:'Deux z et 3 donnent 21.'},
  {type:'mcq', num:24, left:[{label:'21',shape:'circle',color:'white'}], right:[{label:'z',shape:'triangle',color:'#fed7aa'},{label:'z',shape:'triangle',color:'#fed7aa'},{label:'3',shape:'rect',color:'#bfdbfe'}], options:['21 = 18 + 3','21 = 2z + 3','21 = 2z - 3','21 = 2 = z + 3'], correct:1},
  {type:'build', num:25, equation:'2y + 1 = 17', targetLeft:['y','y','1'], targetRight:['17'], palette:['y','1','17'], hint:'Le côté gauche doit contenir deux y et 1.'},
  {type:'build', num:26, equation:'3m + 2 = 11', targetLeft:['m','m','m','2'], targetRight:['11'], palette:['m','2','11'], hint:'Le côté gauche doit contenir trois m et 2.'},
  {type:'build', num:27, equation:'2w + 8 = 13', targetLeft:['w','w','8'], targetRight:['13'], palette:['w','8','13'], hint:'Le côté gauche doit contenir deux w et 8.'}
];
let index=0; let unlocked=Array(slides.length).fill(false); unlocked[0]=true; let buildState={left:[],right:[]}; let currentAngle=0;
const slideEl=document.getElementById('slide');
function escapeHtml(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function norm(s){return String(s).replace(/\s+/g,'').replace(/,/g,'.');}
function parseValue(s){const t=norm(s); if(!t) return NaN; if(!/^[0-9+\-*/().]+$/.test(t)) return NaN; try{const v=Function('"use strict"; return ('+t+')')(); return Number.isFinite(v)?v:NaN;}catch(e){return NaN;}}
function sameMultiset(a,b){if(a.length!==b.length)return false; const aa=[...a].sort().join('|'), bb=[...b].sort().join('|'); return aa===bb;}
const TRACE_KEY='activite_balance_traces_raisonnement_v1';
function traceId(s){return 'defi_'+s.num;}
function loadTrace(){try{return JSON.parse(localStorage.getItem(TRACE_KEY)||'{}');}catch(e){return {};}}
function saveTrace(data){localStorage.setItem(TRACE_KEY, JSON.stringify(data));}
function updateCurrentTrace(extra={}){const s=slides[index]; if(!s||s.type!=='input') return; const input=document.getElementById('answer'); const reasoning=document.getElementById('reasoning'); const data=loadTrace(); const previous=data[traceId(s)]||{}; data[traceId(s)]={slide:s.num, variable:s.variable, valeur_attendue:s.answer, valeur_saisie:input?input.value:'', raisonnement:reasoning?reasoning.value:'', derniere_modification:new Date().toLocaleString('fr-FR'), ...previous, ...extra}; saveTrace(data);}
function exportTrace(){const data=loadTrace(); const inputSlides=slides.filter(s=>s.type==='input'); const lines=[]; lines.push('Activité : Balances et équations'); lines.push('Traces écrites de l’élève'); lines.push('Export : '+new Date().toLocaleString('fr-FR')); lines.push(''); inputSlides.forEach(s=>{const d=data[traceId(s)]||{}; lines.push('Défi '+s.num+' — '+s.variable+' = ?'); lines.push('Valeur saisie : '+(d.valeur_saisie||'')); lines.push('Raisonnement :'); lines.push((d.raisonnement||'').trim()||'(non renseigné)'); lines.push('Statut : '+(d.statut||'non validé')); lines.push('');}); const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='traces-activite-balances.txt'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);}
function updateProgress(){document.getElementById('progressText').textContent=`Écran ${index+1} / ${slides.length}`;document.getElementById('progressBar').style.width=`${((index+1)/slides.length)*100}%`;}
function itemStyle(label){const isVar=/^[a-z]$/i.test(label); if(isVar) return {shape:'rect',color:'#fecaca'}; if(label==='18'||label==='28'||label==='14'||label==='16'||label==='17'||label==='13'||label==='11'||label==='10') return {shape:'rectTall',color:'#bbf7d0'}; return {shape:'rect',color:'#bfdbfe'};}
function renderItem(it, x, y){const label=it.label, shape=it.shape||itemStyle(label).shape, color=it.color||itemStyle(label).color, stroke=it.stroke||'#475569'; let body='';
  if(shape==='circle') body=`<circle cx="${x}" cy="${y+24}" r="25" fill="${color}" stroke="#111827" stroke-width="3"/>`;
  else if(shape==='triangle') body=`<polygon points="${x},${y-6} ${x-30},${y+52} ${x+30},${y+52}" fill="${color}" stroke="#64748b" stroke-width="3"/>`;
  else if(shape==='pentagon') body=`<polygon points="${x},${y-4} ${x+34},${y+20} ${x+22},${y+62} ${x-22},${y+62} ${x-34},${y+20}" fill="${color}" stroke="#f97316" stroke-width="3"/>`;
  else if(shape==='rectTall') body=`<rect x="${x-25}" y="${y-8}" width="50" height="95" rx="2" fill="${color}" stroke="#475569" stroke-width="3"/>`;
  else body=`<rect x="${x-24}" y="${y}" width="48" height="55" rx="3" fill="${color}" stroke="#ef4444" stroke-width="3"/>`;
  const txtY= shape==='triangle'?y+34: shape==='rectTall'?y+47:y+33;
  return `${body}<text x="${x}" y="${txtY}" text-anchor="middle" dominant-baseline="middle" font-size="26" font-family="Georgia,serif" fill="#111827">${escapeHtml(label)}</text>`;
}
function endpoint(cx,cy,dx,angle){const rad=angle*Math.PI/180;return {x:cx+dx*Math.cos(rad), y:cy+dx*Math.sin(rad)};}
function balanceSVG(left=[],right=[],angle=0,status='Not Balanced', blank=false){const cx=300, cy=150, lx=-120, rx=120; const L=endpoint(cx,cy,lx,angle), R=endpoint(cx,cy,rx,angle); const color=status==='Balanced!'?'#2f9e57':'#d9534f';
  let items=''; if(!blank){left.forEach((it,i)=>{items+=renderItem(it,L.x,L.y+35+i*64)}); right.forEach((it,i)=>{items+=renderItem(it,R.x,R.y+35+i*64)});}
  return `<svg viewBox="0 0 600 430" role="img" aria-label="balance">
    <rect x="12" y="12" width="576" height="406" rx="12" fill="#fff" stroke="#e5e7eb"/>
    ${!blank?`<text x="300" y="62" text-anchor="middle" font-size="24" font-weight="700" fill="${color}">${status}</text>`:''}
    <line x1="300" y1="70" x2="300" y2="150" stroke="#111827" stroke-width="4"/>
    <line x1="${L.x}" y1="${L.y}" x2="${R.x}" y2="${R.y}" stroke="#111827" stroke-width="4" stroke-linecap="round"/>
    <line x1="${L.x}" y1="${L.y}" x2="${L.x}" y2="${L.y+35}" stroke="#111827" stroke-width="3"/>
    <line x1="${R.x}" y1="${R.y}" x2="${R.x}" y2="${R.y+35}" stroke="#111827" stroke-width="3"/>
    ${items}
  </svg>`;
}
function navHtml(canNext=false){return `<div class="nav"><button class="secondary" onclick="prevSlide()" ${index===0?'disabled style="opacity:.45;cursor:not-allowed"':''}>← Précédent</button><button id="nextBtn" class="primary ${canNext?'':'locked'}" onclick="nextSlide()">Suivant →</button></div>`;}
function render(){updateProgress(); const s=slides[index]; buildState={left:[],right:[]}; currentAngle=s.tilt||0; if(s.type==='intro') return renderIntro(); if(s.type==='input') return renderInput(s); if(s.type==='mcq') return renderMCQ(s); if(s.type==='build') return renderBuild(s);}
function renderIntro(){slideEl.innerHTML=`<div class="screenBadge">1</div><div class="introGrid"><div class="miniBalances"><div class="mini">${balanceSVG([{label:'x',shape:'circle',color:'white'},{label:'4',shape:'rect',color:'#bbf7d0'}],[{label:'6',shape:'rect',color:'#c9b6f2'},{label:'6',shape:'rect',color:'#c9b6f2'}],7,'Not Balanced')}</div><div class="mini">${balanceSVG([{label:'x',shape:'circle',color:'white'},{label:'4',shape:'rect',color:'#bbf7d0'}],[{label:'6',shape:'rect',color:'#c9b6f2'},{label:'6',shape:'rect',color:'#c9b6f2'}],0,'Balanced!')}</div></div><div class="panel"><h1>Équilibrer la balance</h1><p>Sur les écrans suivants, tu vas rencontrer des poids attachés à des balances.</p><div class="instructionList"><div><span>⚖️</span><span>Chaque balance commence en position de <strong>non-équilibre</strong>.</span></div><div><span>🔎</span><span>Un poids inconnu est noté par une lettre. Ton objectif est de trouver sa valeur.</span></div><div><span>✅</span><span>Quand la valeur est correcte, la balance s’anime et devient équilibrée.</span></div><div><span>✏️</span><span>Pour les écrans « dessine », tu construis la balance avec des masses à placer à gauche et à droite.</span></div></div><div class="btnRow"><button class="primary" onclick="nextSlide()">Commencer l’activité</button></div></div></div>`;}
function renderInput(s){const saved=loadTrace()[traceId(s)]||{}; slideEl.innerHTML=`<div class="screenBadge">${s.num}</div><div class="layout"><div class="balanceCard" id="balanceBox">${balanceSVG(s.left,s.right,currentAngle,'Not Balanced')}</div><div class="panel"><h2>Quelle valeur équilibre la balance ?</h2><p>Saisis la valeur de <strong>${s.variable}</strong>, puis explique ton raisonnement au clavier.</p><div class="inputRow"><label>${s.variable} = </label><input id="answer" class="answerInput" autocomplete="off" inputmode="decimal" placeholder="ta réponse" value="${escapeHtml(saved.valeur_saisie||'')}"></div><div class="reasonBox"><label class="reasonLabel" for="reasoning">Mon raisonnement</label><textarea id="reasoning" class="reasonTextarea" placeholder="Exemple : à droite il y a 4 + 4, donc la masse inconnue vaut 8.">${escapeHtml(saved.raisonnement||'')}</textarea><div class="traceNote">Le raisonnement est enregistré dans ce navigateur. L’élève peut le télécharger avec le bouton en haut à droite.</div></div><div class="btnRow"><button class="primary" onclick="checkInput()">Valider</button><button class="ghost" onclick="showHint()">Indice</button><span class="reasonBadge">✍️ trace écrite</span></div><div class="feedback info" id="hint">${escapeHtml(s.tip||'Compare les masses à gauche et à droite.')}</div><div class="feedback" id="feedback"></div>${navHtml(false)}</div></div>`; const input=document.getElementById('answer'); const reasoning=document.getElementById('reasoning'); input.focus(); input.addEventListener('keydown',e=>{if(e.key==='Enter')checkInput();}); input.addEventListener('input',()=>updateCurrentTrace()); reasoning.addEventListener('input',()=>updateCurrentTrace());}
function showHint(){document.getElementById('hint').classList.add('show');}
function animateToBalanced(s){const start=currentAngle, end=0, duration=720, t0=performance.now(); const box=document.getElementById('balanceBox'); function step(now){const t=Math.min(1,(now-t0)/duration); const ease=1-Math.pow(1-t,3); const angle=start+(end-start)*ease; box.innerHTML=balanceSVG(s.left,s.right,angle,t<1?'Not Balanced':'Balanced!'); if(t<1) requestAnimationFrame(step); else {currentAngle=0; box.classList.add('successPulse'); setTimeout(()=>box.classList.remove('successPulse'),900);} } requestAnimationFrame(step);}
function checkInput(){const s=slides[index]; const input=document.getElementById('answer'); const reasoning=document.getElementById('reasoning'); const fb=document.getElementById('feedback'); const val=parseValue(input.value); const hasReason=reasoning && reasoning.value.trim().length>0; if(Math.abs(val-s.answer)<1e-9){input.classList.remove('ko');input.classList.add('ok'); const msg=hasReason?`Bravo ! ${s.variable} = ${s.answer}. La balance est équilibrée et ton raisonnement est enregistré.`:`Bravo ! ${s.variable} = ${s.answer}. La balance est équilibrée. Pense à compléter ton raisonnement écrit.`; fb.className='feedback ok show'; fb.innerHTML=msg; updateCurrentTrace({statut:'réponse juste'}); animateToBalanced(s); unlockNext();} else {input.classList.remove('ok'); input.classList.add('ko'); fb.className='feedback ko show'; fb.textContent=isNaN(val)?'Je ne peux pas lire cette valeur. Écris un nombre, par exemple 4 ou 4,5.':'Pas encore. Vérifie la somme des masses de chaque côté, puis complète ton raisonnement.'; updateCurrentTrace({statut:'réponse à reprendre'}); const box=document.getElementById('balanceBox'); box.classList.add('shake'); setTimeout(()=>box.classList.remove('shake'),350);}}
function renderMCQ(s){slideEl.innerHTML=`<div class="screenBadge">${s.num}</div><div class="layout"><div class="balanceCard" id="balanceBox">${balanceSVG(s.left,s.right,0,'Balanced!')}</div><div class="panel"><h2>Quelle équation représente la situation ?</h2><div class="options">${s.options.map((o,i)=>`<button class="option" onclick="checkMCQ(${i})"><span class="radio"></span><span>${escapeHtml(o)}</span></button>`).join('')}</div><div class="feedback" id="feedback"></div>${navHtml(false)}</div></div>`;}
function checkMCQ(choice){const s=slides[index]; const options=[...document.querySelectorAll('.option')]; const fb=document.getElementById('feedback'); if(choice===s.correct){options[choice].classList.add('correct'); options.forEach(b=>b.disabled=true); fb.className='feedback ok show'; fb.innerHTML='Bonne réponse ! Cette équation traduit exactement les masses de la balance.'; const box=document.getElementById('balanceBox'); box.classList.add('successPulse'); setTimeout(()=>box.classList.remove('successPulse'),900); unlockNext();} else {options[choice].classList.add('wrong'); fb.className='feedback ko show'; fb.textContent='Essaie encore : chaque masse visible doit apparaître dans l’équation.'; const box=document.getElementById('balanceBox'); box.classList.add('shake'); setTimeout(()=>box.classList.remove('shake'),350);}}
function renderBuild(s){slideEl.innerHTML=`<div class="screenBadge">${s.num}</div><div class="layout"><div class="balanceCard" id="balanceBox">${balanceSVG([],[],0,'Balanced!',true)}</div><div class="panel"><h2>Construis la balance</h2><p>Dessine les masses qui correspondent à l’équation suivante.</p><div class="formula">${escapeHtml(s.equation)}</div><p class="small">Clique sur une masse puis choisis le côté où tu veux la placer.</p><div class="palette">${s.palette.map(t=>`<div><div class="token ${/^[a-z]$/i.test(t)?'var':(Number(t)>=10?'big':'num')}">${escapeHtml(t)}</div><div class="sideAdd"><button class="secondary" onclick="addToken('left','${escapeHtml(t)}')">Gauche</button><button class="secondary" onclick="addToken('right','${escapeHtml(t)}')">Droite</button></div></div>`).join('')}</div><div class="buildGrid"><div class="dropSide"><h3>Côté gauche</h3><div id="leftTokens" class="tokens"></div></div><div class="dropSide"><h3>Côté droit</h3><div id="rightTokens" class="tokens"></div></div></div><div class="btnRow"><button class="primary" onclick="checkBuild()">Valider</button><button class="secondary" onclick="resetBuild()">Effacer</button><button class="ghost" onclick="showCorrectionBuild()">Voir le modèle</button></div><div class="feedback" id="feedback"></div><div class="correction" id="correction"><strong>Modèle attendu :</strong> gauche : <span class="kbd">${escapeHtml(s.targetLeft.join(' + '))}</span> ; droite : <span class="kbd">${escapeHtml(s.targetRight.join(' + '))}</span>.</div>${navHtml(false)}</div></div>`; refreshBuild();}
function buildItems(arr){return arr.map(t=>{const st=itemStyle(t); return {label:t,shape:st.shape,color:st.color};});}
function addToken(side,t){buildState[side].push(t); refreshBuild();}
function resetBuild(){buildState={left:[],right:[]}; refreshBuild(); document.getElementById('feedback').className='feedback'; document.getElementById('correction').classList.remove('show');}
function refreshBuild(){const lt=document.getElementById('leftTokens'), rt=document.getElementById('rightTokens'); if(lt)lt.innerHTML=buildState.left.map((t,i)=>`<button class="token ${/^[a-z]$/i.test(t)?'var':(Number(t)>=10?'big':'num')}" title="Retirer" onclick="removeToken('left',${i})">${escapeHtml(t)}</button>`).join(''); if(rt)rt.innerHTML=buildState.right.map((t,i)=>`<button class="token ${/^[a-z]$/i.test(t)?'var':(Number(t)>=10?'big':'num')}" title="Retirer" onclick="removeToken('right',${i})">${escapeHtml(t)}</button>`).join(''); const box=document.getElementById('balanceBox'); if(box){box.innerHTML=balanceSVG(buildItems(buildState.left),buildItems(buildState.right),0,'Balanced!', false);}}
function removeToken(side,i){buildState[side].splice(i,1); refreshBuild();}
function checkBuild(){const s=slides[index]; const fb=document.getElementById('feedback'); if(sameMultiset(buildState.left,s.targetLeft)&&sameMultiset(buildState.right,s.targetRight)){fb.className='feedback ok show'; fb.textContent='Bravo ! La balance représente bien l’équation.'; const box=document.getElementById('balanceBox'); box.classList.add('successPulse'); setTimeout(()=>box.classList.remove('successPulse'),900); unlockNext();} else {fb.className='feedback ko show'; fb.textContent='Pas encore. Regarde le nombre de masses de chaque côté de l’équation.'; const box=document.getElementById('balanceBox'); box.classList.add('shake'); setTimeout(()=>box.classList.remove('shake'),350);}}
function showCorrectionBuild(){document.getElementById('correction').classList.add('show');}
function unlockNext(){if(index<slides.length-1){unlocked[index+1]=true; const btn=document.getElementById('nextBtn'); if(btn)btn.classList.remove('locked');} else {const btn=document.getElementById('nextBtn'); if(btn){btn.textContent='Terminé'; btn.classList.remove('locked');}}}
function nextSlide(){if(index<slides.length-1){index++; unlocked[index]=true; render(); window.scrollTo({top:0,behavior:'smooth'});} else {slideEl.innerHTML=`<div class="panel" style="max-width:720px;margin:70px auto;text-align:center"><h1>Activité terminée !</h1><p>Tu as travaillé la lecture d’une balance, la recherche d’une valeur inconnue et l’écriture d’équations.</p><div class="btnRow" style="justify-content:center"><button class="primary" onclick="index=0;render()">Recommencer</button></div></div>`;}}
function prevSlide(){if(index>0){index--; render(); window.scrollTo({top:0,behavior:'smooth'});}}
render();
</script>
</body>
</html>
